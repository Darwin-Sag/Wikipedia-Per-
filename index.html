                <p estilo="font-style: italic;"> &nbsp;&nbsp;&nbsp;&nbsp;Para otros usos de este término, véase<span estilo="color:#5A66CC;">Perú (desambiguación).< /abarcar></p><br> 

                <p>El Perú, oficialmente República del Perú[a] (en quechua: Piruw Ripuwlika y en aimara: Piruwxa Ripuwlika), es un Estado soberano, ubicado en el oeste de América del Sur. Limita al norte, con Ecuador y Colombia; al este, con Brasil y Bolivia; al sur, con Chile; y al oeste, con el océano Pacífico, que bordea sus 2250 km de costa.[12] Su territorio se compone de diversos paisajes: los valles, las mesetas y las altas cumbres de los Andes se despliegan al oeste hacia la costa desértica y el este hacia la Amazonia. Es uno de los países con mayor diversidad biológica y mayores recursos minerales del mundo.[13][14]</P>
                
                 <p>El Territorio del Perú es una región que albergó Sucesivas Civilizaciones Andinas Desde el Surgimiento de Caral-Supe en el 3200 a. c.[15] El Imperio Incaico Fue el Último Estado Indígena, Dominando Gran Parte del Occidente Sudamericano Hacia El Siglo XV. En el Siglo Siguiente se Produjo La Conquista del Imperio Incaico, Tras La Cual El Territorio se Configurado Como Virreinato del Perú, Pasando A Formar Parte del Imperio Español. La Formación del Orden Virreinal Produjo Una Profunda Transformación de Estas SoCiedades Mediante El Mestizaje, Un Proceso Que Ha Definido La Conformación de la Sociedad Peruana como mestiza.[16] Con Los Austrias La Población Indígena y La Esclavizada de Orígenes Africano Se Empleó Sistemáticamente En La Conquista, La Extracción De Plata Y Oro Mediante Sistemas Como La Mita, o Como Fuerza Laboral en las haciendas. Se Fundaron Universidades, Como la Universidad Nacional Mayor de San Marcos de Lima EN 1551, La Primera y más Antigua Universidad del Nuevo Mundo en el Continente.[17] Se elaboró la Recopilación Española de la Gramática de la Lengua Quechua Actualización por Domingo de Santo Tomás en el año 1560. Las Reformas Borbónicas del Siglo XVIII Buscaron Racionalizar Los Recursos, Pero Fragmentaron El Virreinato Que Abarcaba Gran Parte de América del Sur, y Sus Nuevas Cargas Fiscales Desembocaron en la Rebelión de Túpac Amaru II.[18]</P>
